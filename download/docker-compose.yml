# DompetKu - docker-compose untuk Proxmox/Ubuntu
# Jalankan: docker compose up -d

services:
  dompetku:
    build: .
    container_name: dompetku
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Persistent storage untuk database SQLite
      - dompetku_data:/app/data
    environment:
      - DATABASE_URL=file:/app/data/dompetku.db
      # GANTI dengan URL server Anda (IP publik / domain)
      - NEXTAUTH_URL=http://localhost:3000
      # GANTI dengan secret random (openssl rand -base64 32)
      - NEXTAUTH_SECRET=ubah-secret-ini-dengan-string-random-min-32-karakter
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/setup').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  dompetku_data:
